<html lang="pt-BR">
<head>

<meta property="og:description" content="Case study by [YOUR NAME] — the situation, the decisions, and what changed.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191A23'/%3E%3C/svg%3E">
<title>Case Study</title>
<link rel="stylesheet" href="assets/ds-tokens.css">
<link rel="stylesheet" href="assets/ds-components.css">
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('fonts/SpaceGrotesk-Variable.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Material Symbols Rounded';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/MaterialSymbolsRounded-Outline.woff2') format('woff2');
  }
  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal;
    display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none;
    white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: middle;
  }
  :root {
    --color-accent: #FF9900;
    --color-accent-hover: #E68A00;
    --color-dark: #191A23;
    --color-dark-soft: #2B2C38;
    --color-light: #F3F3F3;
    --color-white: #FFFFFF;
    --color-text: #191A23;
    --color-text-muted: #6B6B76;
    --color-border: #E2E2E2;
    --font-family: 'Space Grotesk', sans-serif;

    --text-h1: 700 60px/1.1 var(--font-family);
    --text-h3: 600 28px/1.2 var(--font-family);
    --text-h4: 600 20px/1.3 var(--font-family);
    --text-h1-mobile: 700 32px/1.15 var(--font-family);
    --text-h3-mobile: 600 22px/1.25 var(--font-family);
    --text-h4-mobile: 600 18px/1.3 var(--font-family);

    --radius-md: 14px;
    --radius-lg: 24px;
    --radius-full: 999px;

    --shadow-sm: 0 2px 8px rgba(25, 26, 35, 0.06);
    --shadow-md: 0 8px 24px rgba(25, 26, 35, 0.1);

    --duration-fast: 120ms;
    --duration-base: 220ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-family); color: var(--color-text); background: var(--color-light); -webkit-font-smoothing: antialiased; }
  a { color: var(--color-dark); }
  a:hover { color: var(--color-dark-soft); text-decoration-line: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--color-accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 999;
    background: var(--color-accent); color: var(--color-dark);
    padding: 12px 20px; font-weight: 700; border-radius: 0 0 12px 0;
  }
  .skip-link:focus { left: 0; }

  #root { min-height: 100vh; }

  .site-header { position: sticky; top: 0; z-index: 50; padding: 16px 20px 0; background: var(--color-light); }
  .navbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    max-width: 1240px; margin: 0 auto; padding: 12px 20px; border-radius: var(--radius-lg);
    border: 1px solid var(--color-border); background: var(--color-white);
  }
  .logo { font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; gap: 8px; color: var(--color-dark); }
  .logo:hover { color: var(--color-dark); text-decoration: none; }
  .logo-mark { width: 20px; height: 20px; background: var(--color-dark); border-radius: 6px; display: inline-block; }
  .nav-links { display: flex; flex-wrap: wrap; gap: 24px; list-style: none; margin: 0; padding: 0; }
  .nav-links a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--color-text); }
  .nav-links a.active { font-weight: 700; color: var(--color-dark); box-shadow: inset 0 -3px 0 0 var(--color-accent); }
  .navbar-actions { display: flex; align-items: center; gap: 10px; }
  .lang-toggle {
    background: var(--color-light); border: 1px solid var(--color-border); color: var(--color-dark);
    font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-family);
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .lang-toggle:hover { background: var(--color-border); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .lang-toggle:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }
  .cta-btn {
    background: var(--color-dark); color: var(--color-white); font-weight: 600; font-size: 13px;
    padding: 10px 20px; border-radius: var(--radius-full); text-decoration: none; white-space: nowrap;
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .cta-btn:hover { background: var(--color-dark-soft); transform: translateY(-2px); box-shadow: var(--shadow-md); color: var(--color-white); text-decoration: none; }
  .cta-btn:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }

  .menu-btn {
    display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
    border-radius: var(--radius-full); border: none; background: var(--color-light); cursor: pointer;
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
  }
  .menu-btn:hover { background: var(--color-border); transform: translateY(-2px); }
  .menu-btn:active { transform: translateY(0) scale(0.97); }
  .menu-btn .material-symbols-rounded { font-size: 22px; }
  .navbar-actions .menu-btn { display: none; }

  .mobile-drawer {
    position: fixed; inset: 0; background: var(--color-white); z-index: 200;
    display: flex; flex-direction: column; padding: 20px;
    transform: translateY(-100%);
    transition: transform var(--duration-base) var(--ease-in-out);
  }
  .mobile-drawer.is-open { transform: translateY(0); }
  .mobile-drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--color-border);
  }
  .mobile-drawer-links { display: flex; flex-direction: column; gap: 2px; }
  .mobile-drawer-links a {
    text-decoration: none; color: var(--color-text); font-size: 18px; font-weight: 600;
    padding: 14px 10px; border-radius: var(--radius-md); transition: background-color var(--duration-fast) var(--ease-out);
  }
  .mobile-drawer-links a:hover { background: var(--color-light); text-decoration: none; color: var(--color-text); }
  .mobile-drawer-links a.active { color: var(--color-accent); }
  .mobile-drawer-lang { align-self: flex-start; margin: 14px 10px 0; }
  .mobile-drawer-cta { margin-top: auto; text-align: center; }

  .breadcrumb { max-width: 900px; margin: 32px auto 0; padding: 0 24px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); }
  .breadcrumb a { text-decoration: none; color: var(--color-text-muted); }
  .breadcrumb .current { color: var(--color-dark); font-weight: 600; }

  .case-hero { max-width: 900px; margin: 0 auto; padding: 24px 24px 0; }
  .case-hero h1 { margin: 0 0 12px; font: var(--text-h1); }
  .case-hero .result-line {
    margin: 0; font: var(--text-h4); font-weight: 600; color: var(--color-dark);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .result-bar { width: 4px; align-self: stretch; min-height: 24px; border-radius: var(--radius-full); background: var(--color-accent); flex-shrink: 0; }

  .ph-box {
    background: repeating-linear-gradient(135deg, #e2e2e2 0 10px, #ececec 10px 20px);
    border: 1px dashed #b8b8b8; color: var(--color-text-muted);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 13px; font-weight: 600; border-radius: var(--radius-md);
  }
  .cover-box { max-width: 900px; margin: 32px auto 0; height: 420px; border-radius: var(--radius-lg); }

  .case-article { max-width: 760px; margin: 0 auto; padding: 56px 24px 100px; display: flex; flex-direction: column; gap: 56px; }
  .case-section h2 { font: var(--text-h3); margin: 0 0 16px; }
  .case-section p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--color-text); }

  .process-intro { margin: 0 0 24px; font-size: 15px; color: var(--color-text-muted); }
  .decisions-grid { display: flex; flex-direction: column; gap: 20px; }
  .decision-card {
    background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: 24px; display: flex; flex-direction: column; gap: 10px;
    transition: transform var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
  }
  .decision-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .decision-card h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .decision-card p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--color-text-muted); }
  .artifact-box { height: 260px; margin-top: 24px; border-radius: var(--radius-md); }

  .ai-section { background: var(--color-light); border-radius: var(--radius-md); padding: 28px; }
  .ai-section h2 { font: var(--text-h4); margin: 0 0 12px; }
  .ai-section p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--color-text); }
  .ai-section[hidden] { display: none; }

  .case-nav { border-top: 1px solid var(--color-border); padding-top: 32px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .back-link { text-decoration: none; color: var(--color-dark); font-weight: 600; font-size: 15px; }
  .case-nav .cta-btn { font-size: 14px; padding: 12px 22px; }

  .site-footer { background: var(--color-dark); color: rgba(255, 255, 255, .85); padding: 48px 24px 32px; }
  .footer-top { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; }
  .footer-brand { margin: 0; font-weight: 700; color: var(--color-white); }
  .footer-links { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .footer-links a { color: rgba(255, 255, 255, .85); text-decoration: none; font-size: 14px; }
  .footer-lang-toggle {
    background: transparent; border: 1px solid rgba(255, 255, 255, .4); color: var(--color-white);
    font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-family);
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
  }
  .footer-lang-toggle:hover { background: rgba(255, 255, 255, .1); transform: translateY(-2px); }
  .footer-lang-toggle:active { transform: translateY(0) scale(0.97); }
  .copyright { max-width: 1240px; margin: 32px auto 0; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, .15); font-size: 13px; color: rgba(255, 255, 255, .5); }

  @keyframes pageLoadingSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  @media (max-width: 640px) {
    :root { --text-h1: var(--text-h1-mobile); --text-h3: var(--text-h3-mobile); --text-h4: var(--text-h4-mobile); }
    .nav-links, .navbar-actions .lang-toggle, .navbar-actions .cta-btn { display: none; }
    .navbar-actions .menu-btn { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

      <section class="case-section" aria-labelledby="process-h">

<script src="assets/site.js"></script>
<script>
(function () {
  var NAV_COPY = {
    en: {
      skip: 'Skip to content', brandName: '[YOUR NAME]', work: 'Work', about: 'About', contact: 'Contact',
      toggle: 'PT', toggleAria: 'Switch to Portuguese', getInTouch: 'Say hello', cv: 'CV (PDF)',
      copyright: '© 2026 [YOUR NAME]. All rights reserved.',
      setupHeading: 'The situation', roleHeading: 'What I did (and what I couldn’t change)', processHeading: 'How I got there: decisions & trade-offs',
      processIntro: 'What I tried first, what didn’t work, and where I changed my mind.', artifactAlt: 'Placeholder for sketches, wireframes, or flow diagrams',
      resultHeading: 'What changed', reflectionHeading: 'Looking back', aiHeading: 'Where AI helped',
      moreCasesLabel: 'More case studies', backToWork: '← See other projects'
    },
    pt: {
      skip: 'Ir para o conteúdo', brandName: '[SEU NOME]', work: 'Trabalhos', about: 'Sobre', contact: 'Contato',
      toggle: 'EN', toggleAria: 'Mudar para inglês', getInTouch: 'Vamos conversar', cv: 'CV (PDF)',
      copyright: '© 2026 [SEU NOME]. Todos os direitos reservados.',
      setupHeading: 'A situação', roleHeading: 'O que eu fiz (e o que eu não podia mudar)', processHeading: 'Como cheguei lá: decisões e trade-offs',
      processIntro: 'O que testei primeiro, o que não funcionou e onde mudei de ideia.', artifactAlt: 'Placeholder para sketches, wireframes ou fluxos',
      resultHeading: 'O que mudou', reflectionHeading: 'Olhando para trás', aiHeading: 'Onde a IA ajudou',
      moreCasesLabel: 'Mais cases', backToWork: '← Ver outros projetos'
    }
  };

  function fullCase(lang, id) {
    var t = lang === 'pt';
    return {
      title: t ? '[CASE ' + id + ': TÍTULO]' : '[CASE ' + id + ': TITLE]',
      resultLine: t ? '[CASE ' + id + ': RESULTADO/MÉTRICA — ex.: Reduziu abandono no onboarding em 34%]' : '[CASE ' + id + ': RESULT/METRIC — e.g. Reduced onboarding drop-off by 34%]',
      coverAlt: t ? '[IMAGEM] Placeholder da imagem principal do case ' + id : '[IMAGE] Placeholder for case ' + id + ' hero image',
      setup: t ? '[DESCRIÇÃO: qual era o produto, o problema, e por que importava para o negócio — 2-3 frases]' : '[DESCRIPTION: what the product was, the problem, and why it mattered to the business — 2-3 sentences]',
      role: t ? '[DESCRIÇÃO DO PAPEL: o que você fez, com quem colaborou, e o que não podia mudar (constraints) — 1-2 frases]' : '[ROLE DESCRIPTION: what you did, who you worked with, and what you couldn’t change (constraints) — 1-2 sentences]',
      decisions: [
        { title: t ? '[DECISÃO 1: o que testei primeiro]' : '[DECISION 1: what I tried first]', body: t ? '[Por que essa foi a primeira aposta e o que aprendi]' : '[Why this was the first bet and what I learned]' },
        { title: t ? '[DECISÃO 2: o que não funcionou]' : '[DECISION 2: what didn’t work]', body: t ? '[O sinal que me fez pivotar]' : '[The signal that made me pivot]' },
        { title: t ? '[DECISÃO 3: onde pivotei e por quê]' : '[DECISION 3: where I pivoted and why]', body: t ? '[O trade-off que aceitei para chegar na versão final]' : '[The trade-off I accepted to land the final version]' }
      ],
      resultBody: t ? '[RESULTADO em 2-3 frases com números; se os dados forem confidenciais, use percentuais ou sinais qualitativos como adoção do time e feedback de stakeholder — MÉTRICA]' : '[RESULT in 2-3 sentences with numbers; if data is confidential, use percentages or qualitative signals like team adoption and stakeholder feedback — METRIC]',
      reflection: t ? '[O que você faria diferente — 1-2 frases]' : '[What you’d do differently — 1-2 sentences]',
      aiUsage: id === 1 ? (t ? '[Descreva onde e como usou IA — mostrando julgamento, não só a ferramenta]' : '[Describe where and how you used AI — showing judgment, not just the tool]') : null
    };
  }

  function getCaseIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var id = parseInt(params.get('case'), 10);
    return [1, 2, 3, 4, 5].indexOf(id) !== -1 ? id : 1;
  }

  var state = { lang: SiteCraft.detectLang(), caseId: getCaseIdFromUrl() };

  var els = Object.assign(SiteCraft.queryChromeEls(), {
    breadcrumbWork: document.getElementById('breadcrumbWork'),
    breadcrumbTitle: document.getElementById('breadcrumbTitle'),
    heroTitle: document.getElementById('heroTitle'),
    heroResult: document.getElementById('heroResult'),
    coverBox: document.getElementById('coverBox'),
    setupText: document.getElementById('setupText'),
    roleText: document.getElementById('roleText'),
    processIntro: document.getElementById('processIntro'),
    decisionsGrid: document.getElementById('decisionsGrid'),
    artifactBox: document.getElementById('artifactBox'),
    resultText: document.getElementById('resultText'),
    reflectionText: document.getElementById('reflectionText'),
    aiSection: document.getElementById('aiSection'),
    aiText: document.getElementById('aiText'),
    moreCasesNav: document.getElementById('moreCasesNav'),
    backToWork: document.getElementById('backToWork'),
    ctaBottom: document.getElementById('ctaBottom')
  });
  var headings = document.querySelectorAll('[data-i18n-heading]');

  // Runs synchronously on load (no waiting on anything else) so the cover
  // picks up the flight started on the previous page without a visible
  // pause — the arrival is the second half of the click on the case card.
  SiteCraft.playHeroEnterSync(els.coverBox);

  function render() {
    var L = NAV_COPY[state.lang];
    var data = fullCase(state.lang, state.caseId);

    document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';
    document.title = data.title + ' — ' + L.brandName;

    SiteCraft.renderChrome(els, L);
    els.ctaBottom.textContent = L.getInTouch;

    els.breadcrumbWork.textContent = L.work;
    els.breadcrumbTitle.textContent = data.title;
    els.heroTitle.textContent = data.title;
    els.heroResult.textContent = data.resultLine;
    els.coverBox.setAttribute('aria-label', data.coverAlt);

    els.setupText.textContent = data.setup;
    els.roleText.textContent = data.role;
    els.processIntro.textContent = L.processIntro;
    els.artifactBox.setAttribute('aria-label', L.artifactAlt);
    els.resultText.textContent = data.resultBody;
    els.reflectionText.textContent = data.reflection;

    if (data.aiUsage) {
      els.aiSection.hidden = false;
      els.aiText.textContent = data.aiUsage;
    } else {
      els.aiSection.hidden = true;
    }

    els.moreCasesNav.setAttribute('aria-label', L.moreCasesLabel);
    els.backToWork.textContent = L.backToWork;

    headings.forEach(function (h) {
      h.textContent = L[h.getAttribute('data-i18n-heading')];
    });

    els.decisionsGrid.innerHTML = '';
    data.decisions.forEach(function (d) {
      var card = document.createElement('div');
      card.className = 'decision-card';
      var h3 = document.createElement('h3');
      h3.textContent = d.title;
      var p = document.createElement('p');
      p.textContent = d.body;
      card.appendChild(h3);
      card.appendChild(p);
      els.decisionsGrid.appendChild(card);
    });
  }

  function toggleLang() {
    state.lang = state.lang === 'pt' ? 'en' : 'pt';
    SiteCraft.setLang(state.lang);
    render();
  }
  SiteCraft.wireLangToggle(els, toggleLang);
  SiteCraft.wireDrawer(els);

  render();

  SiteCraft.initPageTransitions();
  SiteCraft.fadeInRoot(document.getElementById('root'));
})();
</script>
</body>
</html>
