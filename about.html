<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="About [YOUR NAME] — Product Designer, tools, and availability.">
<meta property="og:type" content="website">
<meta property="og:title" content="About — [YOUR NAME]">
<meta property="og:description" content="About [YOUR NAME] — Product Designer, tools, and availability.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191A23'/%3E%3C/svg%3E">
<title>About</title>
<link rel="stylesheet" href="assets/ds-tokens.css">
<link rel="stylesheet" href="assets/ds-components.css">
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('fonts/SpaceGrotesk-Variable.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Material Symbols Rounded';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/MaterialSymbolsRounded-Outline.woff2') format('woff2');
  }
  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal;
    display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none;
    white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: middle;
  }
  :root {
    --color-accent: #FF9900;
    --color-accent-hover: #E68A00;
    --color-dark: #191A23;
    --color-dark-soft: #2B2C38;
    --color-light: #F3F3F3;
    --color-white: #FFFFFF;
    --color-text: #191A23;
    --color-text-muted: #6B6B76;
    --color-border: #E2E2E2;
    --font-family: 'Space Grotesk', sans-serif;

    --text-h1: 700 60px/1.1 var(--font-family);
    --text-h3: 600 28px/1.2 var(--font-family);
    --text-h4: 600 20px/1.3 var(--font-family);
    --text-h1-mobile: 700 32px/1.15 var(--font-family);

    --radius-md: 14px;
    --radius-lg: 24px;
    --radius-full: 999px;

    --shadow-sm: 0 2px 8px rgba(25, 26, 35, 0.06);
    --shadow-md: 0 8px 24px rgba(25, 26, 35, 0.1);

    --duration-fast: 120ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-family); color: var(--color-text); background: var(--color-light); -webkit-font-smoothing: antialiased; }
  a { color: var(--color-dark); }
  a:hover { color: var(--color-dark-soft); text-decoration-line: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--color-accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 999;
    background: var(--color-accent); color: var(--color-dark);
    padding: 12px 20px; font-weight: 700; border-radius: 0 0 12px 0;
  }
  .skip-link:focus { left: 0; }

  #root { min-height: 100vh; }

  .site-header { position: sticky; top: 0; z-index: 50; padding: 16px 20px 0; background: var(--color-light); }
  /* Nav/botoes: base vem de assets/ds-components.css (.navbar/.logo/.logo-mark/.nav-links/
     .nav-cta/.menu-btn/.mobile-drawer*); aqui so o que difere do componente do DS. */
  .navbar {
    flex-wrap: wrap; gap: 12px;
    max-width: 1240px; margin: 0 auto; padding: 12px 20px; border-radius: var(--radius-lg);
    background: var(--color-white);
  }
  .logo { text-decoration: none; color: var(--color-dark); }
  .logo:hover { color: var(--color-dark); text-decoration: none; }
  .logo-mark { display: inline-block; }
  .nav-links { flex-wrap: wrap; gap: 24px; margin: 0; padding: 0; }
  .nav-links a.active { font-weight: 700; color: var(--color-dark); box-shadow: inset 0 -3px 0 0 var(--color-accent); }
  .navbar-actions { display: flex; align-items: center; gap: 10px; }
  .lang-toggle {
    background: var(--color-light); border: 1px solid var(--color-border); color: var(--color-dark);
    font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-family);
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .lang-toggle:hover { background: var(--color-border); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .lang-toggle:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }
  .nav-cta { white-space: nowrap; transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out); }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); text-decoration: none; }
  .nav-cta:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }

  .menu-btn { transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out); }
  .menu-btn:hover { transform: translateY(-2px); }
  .menu-btn:active { transform: translateY(0) scale(0.97); }
  .menu-btn .material-symbols-rounded { font-size: 22px; }
  .navbar-actions .menu-btn { display: none; }

  .mobile-drawer { position: fixed; inset: 0; z-index: 200; padding: 20px; }
  .mobile-drawer-links a { font-size: 18px; border-radius: var(--radius-md); }
  .mobile-drawer-links a:hover { text-decoration: none; color: var(--color-text); }
  .mobile-drawer-lang { align-self: flex-start; margin: 14px 10px 0; }

  .ph-box {
    background: repeating-linear-gradient(135deg, #e2e2e2 0 10px, #ececec 10px 20px);
    border: 1px dashed #b8b8b8; color: var(--color-text-muted);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 13px; font-weight: 600; border-radius: var(--radius-md);
  }

  .about-hero { max-width: 1000px; margin: 0 auto; padding: 64px 24px 0; display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
  .about-photo { width: 220px; height: 260px; border-radius: var(--radius-lg); }
  .about-hero-content { display: flex; flex-direction: column; gap: 20px; }
  .about-hero-content h1 { margin: 0; font: var(--text-h1); }
  .about-hero-content p { margin: 0; font-size: 17px; line-height: 1.7; color: var(--color-text); }
  /* .cv-btn = .btn .btn-md .btn-accent do DS, com tamanho proprio (entre md e lg) */
  .cv-btn { align-self: flex-start; margin-top: 8px; font-size: 15px; padding: 14px 28px; text-decoration: none; }
  .cv-btn:hover { text-decoration: none; }

  .section { max-width: 1000px; margin: 0 auto; padding: 64px 24px 0; }
  .section h2 { font: var(--text-h3); margin: 0 0 20px; }
  .tools-list { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; margin: 0; padding: 0; }
  .tool-chip { background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 10px 20px; font-size: 14px; font-weight: 600; }

  .avail-box { max-width: 1000px; margin: 64px auto 100px; padding: 0 24px; }
  .avail-box-inner { background: var(--color-dark); color: var(--color-white); border-radius: var(--radius-lg); padding: 36px; display: flex; flex-direction: column; gap: 12px; }
  .avail-box-inner h2 { font: var(--text-h4); margin: 0; }
  .avail-box-inner p { margin: 0; font-size: 16px; line-height: 1.6; color: rgba(255, 255, 255, .85); }

  .site-footer { background: var(--color-dark); color: rgba(255, 255, 255, .85); padding: 48px 24px 32px; }
  .footer-top { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; }
  .footer-brand { margin: 0; font-weight: 700; color: var(--color-white); }
  .footer-links { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .footer-links a { color: rgba(255, 255, 255, .85); text-decoration: none; font-size: 14px; }
  .footer-lang-toggle {
    background: transparent; border: 1px solid rgba(255, 255, 255, .4); color: var(--color-white);
    font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-family);
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
  }
  .footer-lang-toggle:hover { background: rgba(255, 255, 255, .1); transform: translateY(-2px); }
  .footer-lang-toggle:active { transform: translateY(0) scale(0.97); }
  .copyright { max-width: 1240px; margin: 32px auto 0; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, .15); font-size: 13px; color: rgba(255, 255, 255, .5); }

  @keyframes pageLoadingSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  @media (max-width: 640px) {
    :root { --text-h1: var(--text-h1-mobile); }
    .about-hero { grid-template-columns: 1fr; }
    .about-photo { width: 100%; max-width: 240px; }
    .nav-links, .navbar-actions .lang-toggle, .navbar-actions .nav-cta { display: none; }
    .navbar-actions .menu-btn { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<a href="#main" class="skip-link" id="skipLink">Skip to content</a>
<noscript>
  <div style="max-width:640px;margin:80px auto;padding:0 24px;text-align:center;font-family:'Space Grotesk',sans-serif;">
    <p style="font-size:18px;font-weight:600;margin:0 0 8px;color:#191A23;">This page needs JavaScript to show its content. · Esta página precisa de JavaScript para mostrar o conteúdo.</p>
    <p style="font-size:15px;margin:0;color:#6B6B76;">Please enable JavaScript in your browser. · Por favor, ative o JavaScript no seu navegador.</p>
  </div>
</noscript>

<div id="root">
  <header class="site-header">
    <nav aria-label="Primary" class="navbar">
      <a href="index.html" class="logo" id="brandNameNav"><span class="logo-mark"></span><span></span></a>
      <ul class="nav-links">
        <li><a href="work.html" id="navWork"></a></li>
        <li><a href="about.html" aria-current="page" class="active" id="navAbout"></a></li>
        <li><a href="contact.html" id="navContact"></a></li>
      </ul>
      <div class="navbar-actions">
        <button class="lang-toggle" id="langToggleTop"></button>
        <a href="mailto:[EMAIL]" class="nav-cta" id="ctaTop"></a>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileDrawer">
          <span class="material-symbols-rounded" aria-hidden="true">menu</span>
        </button>
      </div>
    </nav>
  </header>

  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-drawer-head">
      <span class="logo" aria-hidden="true"><span class="logo-mark"></span><span id="drawerBrandName"></span></span>
      <button class="menu-btn" id="menuCloseBtn" aria-label="Close menu">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </div>
    <nav class="mobile-drawer-links" aria-label="Primary">
      <a href="work.html" id="drawerNavWork"></a>
      <a href="about.html" aria-current="page" class="active" id="drawerNavAbout"></a>
      <a href="contact.html" id="drawerNavContact"></a>
    </nav>
    <button class="lang-toggle mobile-drawer-lang" id="langToggleDrawer"></button>
    <a href="mailto:[EMAIL]" class="nav-cta mobile-cta" id="ctaDrawer"></a>
  </div>

  <main id="main">
    <section class="about-hero">
      <div class="ph-box about-photo" role="img" id="aboutPhoto">[FOTO PROFISSIONAL]</div>
      <div class="about-hero-content">
        <h1 id="heading"></h1>
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <a href="[LINK DO CV EM PDF]" target="_blank" rel="noopener" class="btn btn-md btn-accent cv-btn" id="downloadCv"></a>

    </section>

    <section class="section" aria-labelledby="tools-h">
      <h2 id="tools-h" data-i18n="toolsHeading"></h2>
      <ul class="tools-list" id="toolsList"></ul>
    </section>

    <section class="avail-box" aria-labelledby="avail-h">

        <p data-i18n="availBody"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-top">
      <p class="footer-brand" id="brandNameFooter"></p>
      <nav aria-label="Footer" class="footer-links">
        <a href="mailto:[EMAIL]" id="footerEmail">[EMAIL]</a>
        <a href="[LINK DO LINKEDIN]" target="_blank" rel="noopener">LinkedIn</a>
        <a href="[LINK DO CV EM PDF]" target="_blank" rel="noopener" id="footerCv"></a>
        <button class="footer-lang-toggle" id="langToggleBottom"></button>
      </nav>
    </div>
    <p class="copyright" id="copyright"></p>
  </footer>
</div>

<script src="assets/site.js"></script>
<script>
(function () {
  var COPY = {
    en: {
      skip: 'Skip to content', brandName: '[YOUR NAME]', work: 'Work', about: 'About', contact: 'Contact',
      toggle: 'PT', toggleAria: 'Switch to Portuguese', getInTouch: 'Say hello',
      heading: 'Hello, nice to meet you', photoAlt: 'Placeholder for professional photo',
      p1: '[Who you are and how you think as a designer — 2-3 sentences, written the way you’d say it out loud. Avoid clichés like "I create meaningful digital experiences."]',
      p2: '[Your niche and what you’re best at — the kind of problems you love, and how you like to work with a team.]',
      p3: '[One concrete detail that shows how you work — a principle, a habit, or something you always push for in product decisions.]',
      downloadCv: 'Download my CV (PDF)',
      toolsHeading: 'Tools I use every day',
      availHeading: 'Where I am, and how we can work together',
      availBody: 'I’m in São Paulo, Brazil (GMT-3) and happy to work remotely — my mornings overlap with Europe and my afternoons with the US East Coast.',
      cv: 'CV (PDF)', copyright: '© 2026 [YOUR NAME]. All rights reserved.'
    },
    pt: {
      skip: 'Ir para o conteúdo', brandName: '[SEU NOME]', work: 'Trabalhos', about: 'Sobre', contact: 'Contato',
      toggle: 'EN', toggleAria: 'Mudar para inglês', getInTouch: 'Vamos conversar',
      heading: 'Oi, prazer em te conhecer', photoAlt: 'Placeholder para foto profissional',
      p1: '[Quem você é e como você pensa como designer — 2-3 frases, escritas do jeito que você falaria. Evite clichês como "eu crio experiências digitais significativas".]',
      p2: '[Seu nicho e no que você é melhor — o tipo de problema que você gosta de resolver e como você gosta de trabalhar em time.]',
      p3: '[Um detalhe concreto que mostra como você trabalha — um princípio, um hábito ou algo que você sempre defende nas decisões de produto.]',
      downloadCv: 'Baixar meu CV (PDF)',
      toolsHeading: 'Ferramentas do meu dia a dia',
      availHeading: 'Onde eu estou e como podemos trabalhar juntos',
      availBody: 'Estou em São Paulo (GMT-3) e trabalho remoto tranquilamente — minhas manhãs coincidem com a Europa e minhas tardes com a Costa Leste dos EUA.',
      cv: 'CV (PDF)', copyright: '© 2026 [SEU NOME]. Todos os direitos reservados.'
    }
  };

  var TOOLS = ['[Figma]', '[FigJam]', '[Notion]', '[Maze]', '[Amplitude]', '[Framer]'];

  var state = { lang: SiteCraft.detectLang() };

  var els = Object.assign(SiteCraft.queryChromeEls(), {
    aboutPhoto: document.getElementById('aboutPhoto'),
    heading: document.getElementById('heading'),
    p1: document.getElementById('p1'),
    p2: document.getElementById('p2'),
    p3: document.getElementById('p3'),
    downloadCv: document.getElementById('downloadCv'),
    toolsList: document.getElementById('toolsList')
  });
  var i18nEls = document.querySelectorAll('[data-i18n]');

  function render() {
    var L = COPY[state.lang];
    document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';
    document.title = L.about + ' — ' + L.brandName;

    SiteCraft.renderChrome(els, L);

    els.aboutPhoto.setAttribute('aria-label', L.photoAlt);
    els.heading.textContent = L.heading;
    els.p1.textContent = L.p1;
    els.p2.textContent = L.p2;
    els.p3.textContent = L.p3;
    els.downloadCv.textContent = L.downloadCv;

    i18nEls.forEach(function (el) { el.textContent = L[el.getAttribute('data-i18n')]; });

    els.toolsList.innerHTML = '';
    TOOLS.forEach(function (tool) {
      var li = document.createElement('li');
      li.className = 'tool-chip';
      li.textContent = tool;
      els.toolsList.appendChild(li);
    });
  }

  function toggleLang() {
    state.lang = state.lang === 'pt' ? 'en' : 'pt';
    SiteCraft.setLang(state.lang);
    render();
  }
  SiteCraft.wireLangToggle(els, toggleLang);
  SiteCraft.wireDrawer(els);

  render();

  SiteCraft.initPageTransitions();
  SiteCraft.fadeInRoot(document.getElementById('root'));
})();
</script>
</body>
</html>
