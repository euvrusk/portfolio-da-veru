<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('fonts/SpaceGrotesk-Variable.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Material Symbols Rounded';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/MaterialSymbolsRounded-Outline.woff2') format('woff2');
  }
  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal;
    display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none;
    white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: middle;
  }
  :root {
    --color-accent: #FF9900;
    --color-accent-hover: #E68A00;
    --color-dark: #191A23;
    --color-dark-soft: #2B2C38;
    --color-light: #F3F3F3;
    --color-white: #FFFFFF;
    --color-text: #191A23;
    --color-text-muted: #6B6B76;
    --color-border: #E2E2E2;
    --color-success: #3DAE5C;
    --font-family: 'Space Grotesk', sans-serif;

    --text-h1: 700 60px/1.1 var(--font-family);
    --text-h2: 700 40px/1.15 var(--font-family);
    --text-h3: 600 28px/1.2 var(--font-family);
    --text-h4: 600 20px/1.3 var(--font-family);
    --text-h1-mobile: 700 32px/1.15 var(--font-family);
    --text-h2-mobile: 700 28px/1.2 var(--font-family);

    --radius-md: 14px;
    --radius-lg: 24px;
    --radius-full: 999px;

    --shadow-sm: 0 2px 8px rgba(25, 26, 35, 0.06);
    --shadow-md: 0 8px 24px rgba(25, 26, 35, 0.1);
    --shadow-lg: 0 16px 40px rgba(25, 26, 35, 0.16);

    --duration-fast: 120ms;
    --duration-base: 220ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-family); color: var(--color-text); background: var(--color-light); -webkit-font-smoothing: antialiased; }
  a { color: var(--color-dark); }
  a:hover { color: var(--color-dark-soft); text-decoration-line: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--color-accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 999;
    background: var(--color-accent); color: var(--color-dark);
    padding: 12px 20px; font-weight: 700; border-radius: 0 0 12px 0;
  }
  .skip-link:focus { left: 0; }

  #root { min-height: 100vh; }

  .site-header { position: sticky; top: 0; z-index: 50; padding: 16px 20px 0; background: var(--color-light); }
  /* Nav/botoes: base vem de assets/ds-components.css (.navbar/.logo/.logo-mark/.nav-links/
     .nav-cta/.menu-btn/.mobile-drawer*); aqui so o que difere do componente do DS. */
  .navbar {
    flex-wrap: wrap; gap: 12px;
    max-width: 1240px; margin: 0 auto; padding: 12px 20px; border-radius: var(--radius-lg);
    background: var(--color-white);
  }
  .logo { text-decoration: none; color: var(--color-dark); }
  .logo:hover { color: var(--color-dark); text-decoration: none; }
  .logo-mark { display: inline-block; }
  .nav-links { flex-wrap: wrap; gap: 24px; margin: 0; padding: 0; }
  .nav-links a.active { font-weight: 700; color: var(--color-dark); box-shadow: inset 0 -3px 0 0 var(--color-accent); }
  .navbar-actions { display: flex; align-items: center; gap: 10px; }
  .lang-toggle {
    background: var(--color-light); border: 1px solid var(--color-border); color: var(--color-dark);
    font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-family);
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .lang-toggle:hover { background: var(--color-border); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .lang-toggle:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }
  .nav-cta { white-space: nowrap; transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out); }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); text-decoration: none; }
  .nav-cta:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }

  .menu-btn { transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out); }
  .menu-btn:hover { transform: translateY(-2px); }
  .menu-btn:active { transform: translateY(0) scale(0.97); }
  .menu-btn .material-symbols-rounded { font-size: 22px; }
  .navbar-actions .menu-btn { display: none; }

  .mobile-drawer { position: fixed; inset: 0; z-index: 200; padding: 20px; }
  .mobile-drawer-links a { font-size: 18px; border-radius: var(--radius-md); }
  .mobile-drawer-links a:hover { text-decoration: none; color: var(--color-text); }
  .mobile-drawer-lang { align-self: flex-start; margin: 14px 10px 0; }

  .ph-box {
    background: repeating-linear-gradient(135deg, #e2e2e2 0 10px, #ececec 10px 20px);
    border: 1px dashed #b8b8b8; color: var(--color-text-muted);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 13px; font-weight: 600; border-radius: var(--radius-md);
  }

  .hero-section { max-width: 1240px; margin: 0 auto; padding: 88px 24px 64px; display: grid; gap: 20px; }
  .hero-kicker { margin: 0; color: var(--color-dark); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .hero-kicker-bar { width: 24px; height: 3px; border-radius: var(--radius-full); background: var(--color-accent); display: inline-block; }
  .hero-title { margin: 0; font: var(--text-h1); max-width: 820px; }
  .hero-value { margin: 0; font: var(--text-h4); color: var(--color-text-muted); font-weight: 400; max-width: 640px; }
  .hero-availability { margin: 8px 0 0; font-size: 15px; font-weight: 600; color: var(--color-dark); display: flex; align-items: center; gap: 8px; }
  .hero-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-success); display: inline-block; }
  .hero-cta-wrap { margin-top: 12px; }
  /* .hero-cta = .btn .btn-lg .btn-accent do DS; so falta o reset de sublinhado (e' um <a>) */
  .hero-cta { text-decoration: none; }
  .hero-cta:hover { text-decoration: none; }

  .section { max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; }
  .section h2 { font: var(--text-h2); margin: 0 0 32px; }

  .proof-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .testimonial {
    margin: 0; background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    padding: 28px; display: flex; flex-direction: column; gap: 16px;
  }
  .testimonial p { margin: 0; font-size: 17px; line-height: 1.5; font-style: normal; }
  .testimonial footer { font-size: 14px; color: var(--color-text-muted); font-weight: 600; }

  .about-strip { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; }
  .about-strip-photo { width: 140px; height: 140px; border-radius: var(--radius-full); flex-shrink: 0; }
  .about-strip-content { display: flex; flex-direction: column; gap: 16px; }
  .about-strip-content h2 { font: var(--text-h3); margin: 0; }
  .about-strip-content p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--color-text-muted); max-width: 640px; }
  /* .about-strip-cta = .btn .btn-md .btn-outline do DS */
  .about-strip-cta { align-self: flex-start; text-decoration: none; }
  .about-strip-cta:hover { text-decoration: none; }

  .final-cta { background: var(--color-dark); color: var(--color-white); padding: 72px 24px; text-align: center; }
  .final-cta-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; align-items: center; }
  .final-cta h2 { font: var(--text-h2); margin: 0; }
  .final-cta-actions { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  /* .final-cta-email = .btn .btn-lg .btn-accent do DS */
  .final-cta-email { text-decoration: none; }
  .final-cta-email:hover { text-decoration: none; }
  /* .final-cta-linkedin nao tem variante no DS (outline branco sobre fundo escuro);
     usa .btn .btn-lg pela mecanica de hover/press e mantem cor propria */
  .final-cta-linkedin { background: transparent; color: var(--color-white); border: 1.5px solid var(--color-white); text-decoration: none; }
  .final-cta-linkedin:hover { background: var(--color-white); color: var(--color-dark); text-decoration: none; }

  .site-footer { background: var(--color-dark); color: rgba(255, 255, 255, .85); padding: 48px 24px 32px; }
  .footer-top { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; }
  .footer-brand { margin: 0; font-weight: 700; color: var(--color-white); }
  .footer-links { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .footer-links a { color: rgba(255, 255, 255, .85); text-decoration: none; font-size: 14px; }
  .footer-lang-toggle {
    background: transparent; border: 1px solid rgba(255, 255, 255, .4); color: var(--color-white);
    font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-family);
    transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
  }
  .footer-lang-toggle:hover { background: rgba(255, 255, 255, .1); transform: translateY(-2px); }
  .footer-lang-toggle:active { transform: translateY(0) scale(0.97); }
  .copyright { max-width: 1240px; margin: 32px auto 0; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, .15); font-size: 13px; color: rgba(255, 255, 255, .5); }

  @keyframes pageLoadingSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  @media (max-width: 640px) {
    :root { --text-h1: var(--text-h1-mobile); --text-h2: var(--text-h2-mobile); }
    .about-strip { grid-template-columns: 1fr; }
    .about-strip-photo { width: 100%; max-width: 240px; }
    .nav-links, .navbar-actions .lang-toggle, .navbar-actions .nav-cta { display: none; }
    .navbar-actions .menu-btn { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

  <footer class="site-footer">

<script src="assets/site.js"></script>
<script>
(function () {
  var COPY = {
    en: {
      skip: 'Skip to content', brandName: '[YOUR NAME]', work: 'Work', about: 'About', contact: 'Contact',
      toggle: 'PT', toggleAria: 'Switch to Portuguese', getInTouch: 'Say hello',
      heroKicker: "Hi, I'm", heroName: '[YOUR NAME]',
      heroTitle: 'a Product Designer working in [NICHE]',
      heroValue: '[VALUE PROPOSITION — one friendly sentence on the outcome you create for people and for the business]',
      availability: 'Happy to work remotely · Here in São Paulo (GMT-3)',
      ctaSeeWork: 'Take a look at my work',
      featuredHeading: "A few things I've worked on",
      proofHeading: "Kind words from people I've worked with",
      photoAlt: 'Placeholder for professional photo',
      aboutStripHeading: '[2-3 sentences on who you are and how you think]',
      aboutStripBody: '[Short bio placeholder — what you focus on, your niche, how you like to work through product problems. Keep it warm and concrete, not generic.]',
      aboutStripCta: 'Get to know me',
      finalCtaHeading: "Let's talk — I'd love to hear from you.",
      cv: 'CV (PDF)', copyright: '© 2026 [YOUR NAME]. All rights reserved.'
    },
    pt: {
      skip: 'Ir para o conteúdo', brandName: '[SEU NOME]', work: 'Trabalhos', about: 'Sobre', contact: 'Contato',
      toggle: 'EN', toggleAria: 'Mudar para inglês', getInTouch: 'Vamos conversar',
      heroKicker: 'Oi, eu sou', heroName: '[SEU NOME]',
      heroTitle: 'Product Designer atuando em [NICHO]',
      heroValue: '[PROPOSTA DE VALOR — uma frase leve sobre o resultado que você gera para as pessoas e para o negócio]',
      availability: 'Trabalho remoto, sem problema · Aqui de São Paulo (GMT-3)',
      ctaSeeWork: 'Dá uma olhada nos projetos',
      featuredHeading: 'Alguns projetos que fiz',
      proofHeading: 'O que dizem quem trabalhou comigo',
      photoAlt: 'Placeholder para foto profissional',
      aboutStripHeading: '[2-3 frases sobre quem você é e como você pensa]',
      aboutStripBody: '[Placeholder de bio curta — seu foco, seu nicho, como você gosta de resolver problemas de produto. Escreva de forma calorosa e concreta, sem clichê.]',
      aboutStripCta: 'Me conheça melhor',
      finalCtaHeading: 'Vamos conversar? Vou gostar de te ouvir.',
      cv: 'CV (PDF)', copyright: '© 2026 [SEU NOME]. Todos os direitos reservados.'
    }
  };

  var CASES = {
    en: [
      { href: 'case-study.html?case=1', title: '[CASE 1: TITLE]', result: '[CASE 1: RESULT/METRIC — e.g. Reduced onboarding drop-off by 34%]', imgAlt: 'Placeholder cover image for case study 1' },
      { href: 'case-study.html?case=2', title: '[CASE 2: TITLE]', result: '[CASE 2: RESULT/METRIC]', imgAlt: 'Placeholder cover image for case study 2' },
      { href: 'case-study.html?case=3', title: '[CASE 3: TITLE]', result: '[CASE 3: RESULT/METRIC]', imgAlt: 'Placeholder cover image for case study 3' }
    ],
    pt: [
      { href: 'case-study.html?case=1', title: '[CASE 1: TÍTULO]', result: '[CASE 1: RESULTADO/MÉTRICA — ex.: Reduziu abandono no onboarding em 34%]', imgAlt: 'Placeholder da imagem de capa do case 1' },
      { href: 'case-study.html?case=2', title: '[CASE 2: TÍTULO]', result: '[CASE 2: RESULTADO/MÉTRICA]', imgAlt: 'Placeholder da imagem de capa do case 2' },
      { href: 'case-study.html?case=3', title: '[CASE 3: TÍTULO]', result: '[CASE 3: RESULTADO/MÉTRICA]', imgAlt: 'Placeholder da imagem de capa do case 3' }
    ]
  };

  var TESTIMONIALS = {
    en: [
      { quote: '[TESTIMONIAL — 1-2 sentences from a manager, stakeholder, or peer]', author: '[NAME, ROLE @ COMPANY]' },
      { quote: '[TESTIMONIAL — 1-2 sentences]', author: '[NAME, ROLE @ COMPANY]' }
    ],
    pt: [
      { quote: '[DEPOIMENTO — 1-2 frases de um gestor, stakeholder ou par]', author: '[NOME, CARGO @ EMPRESA]' },
      { quote: '[DEPOIMENTO — 1-2 frases]', author: '[NOME, CARGO @ EMPRESA]' }
    ]
  };

  var state = { lang: SiteCraft.detectLang(), loading: true };

  var els = Object.assign(SiteCraft.queryChromeEls(), {
    heroKicker: document.getElementById('heroKicker'),
    heroName: document.getElementById('heroName'),
    heroTitle: document.getElementById('heroTitle'),
    heroValue: document.getElementById('heroValue'),
    heroAvailability: document.getElementById('heroAvailability'),
    heroCta: document.getElementById('heroCta'),
    casesGrid: document.getElementById('casesGrid'),
    proofGrid: document.getElementById('proofGrid'),
    aboutStripPhoto: document.getElementById('aboutStripPhoto'),
    aboutStripCta: document.getElementById('aboutStripCta'),
    finalCtaHeading: document.getElementById('finalCtaHeading')
  });
  var i18nEls = document.querySelectorAll('[data-i18n]');

  function renderCasesGrid() {
    var grid = els.casesGrid;
    grid.innerHTML = '';
    if (state.loading) {
      grid.setAttribute('aria-busy', 'true');
      for (var i = 0; i < 3; i++) {
        var card = document.createElement('div');
        card.className = 'skeleton-card';
        card.setAttribute('aria-hidden', 'true');
        card.innerHTML = '<div class="skel skel-cover"></div><div class="skeleton-card-body"><div class="skel skel-line-1"></div><div class="skel skel-line-2"></div></div>';
        grid.appendChild(card);
      }
      return;
    }
    grid.setAttribute('aria-busy', 'false');
    CASES[state.lang].forEach(function (c) {
      var a = document.createElement('a');
      a.className = 'case-card card card-outline';
      a.href = c.href;
      a.innerHTML = '<div class="ph-box" role="img" data-hero="true" aria-label="' + c.imgAlt + '">[IMAGEM]</div>' +
        '<div class="case-card-body"><span class="case-card-title">' + c.title + '</span><span class="case-card-result">' + c.result + '</span></div>';
      grid.appendChild(a);
    });
  }

  function render() {
    var L = COPY[state.lang];
    document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';
    document.title = L.heroName + ' — ' + L.heroTitle;

    SiteCraft.renderChrome(els, L);

    els.heroKicker.textContent = L.heroKicker;
    els.heroName.textContent = L.heroName;
    els.heroTitle.textContent = L.heroTitle;
    els.heroValue.textContent = L.heroValue;
    els.heroAvailability.textContent = L.availability;
    els.heroCta.textContent = L.ctaSeeWork + ' →';

    els.aboutStripPhoto.setAttribute('aria-label', L.photoAlt);
    els.aboutStripCta.textContent = L.aboutStripCta;
    els.finalCtaHeading.textContent = L.finalCtaHeading;

    i18nEls.forEach(function (el) { el.textContent = L[el.getAttribute('data-i18n')]; });

    renderCasesGrid();

    els.proofGrid.innerHTML = '';
    TESTIMONIALS[state.lang].forEach(function (t) {
      var bq = document.createElement('blockquote');
      bq.className = 'testimonial';
      bq.innerHTML = '<p>“' + t.quote + '”</p><footer>' + t.author + '</footer>';
      els.proofGrid.appendChild(bq);
    });
  }

  function toggleLang() {
    state.lang = state.lang === 'pt' ? 'en' : 'pt';
    SiteCraft.setLang(state.lang);
    render();
  }
  SiteCraft.wireLangToggle(els, toggleLang);
  SiteCraft.wireDrawer(els);

  render();
  setTimeout(function () { state.loading = false; render(); }, 320);

  SiteCraft.initPageTransitions();
  SiteCraft.fadeInRoot(document.getElementById('root'));
})();
</script>
</body>
</html>
